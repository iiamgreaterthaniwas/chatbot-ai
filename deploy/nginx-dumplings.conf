# 饺子 Nginx 反向代理配置
# 安装：sudo cp deploy/nginx-dumplings.conf /etc/nginx/sites-available/dumplings
#      sudo ln -s /etc/nginx/sites-available/dumplings /etc/nginx/sites-enabled/
# HTTPS 证书由 certbot 自动添加到这个文件里
server {
    listen 80;
    server_name dumplings.photoidmaker.xyz;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关闭缓冲，AI 回复才能逐字显示
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
