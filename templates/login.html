<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · 饺子 🥟</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥟</text></svg>">
    <style>
        :root {
            --bg: #f6f8f7;
            --surface: #ffffff;
            --text: #1f2328;
            --muted: #6b7280;
            --border: #e4e7eb;
            --accent: #10b981;
            --accent-hover: #059669;
            --accent-soft: #e7f8f1;
            --danger: #dc2626;
            --shadow: 0 10px 40px rgba(16, 24, 40, 0.08);
        }
        :root[data-theme="dark"] {
            --bg: #141517;
            --surface: #1f2124;
            --text: #e6e7e9;
            --muted: #9a9ea6;
            --border: #2f3237;
            --accent: #34d399;
            --accent-hover: #10b981;
            --accent-soft: #163329;
            --danger: #f87171;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px 16px;
            font-size: 15px;
        }
        .card {
            width: 100%; max-width: 380px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 32px 28px 28px;
        }
        .logo {
            width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 14px;
            background: var(--accent-soft);
            display: grid; place-items: center; color: #fff;
        }
        .logo { font-size: 28px; line-height: 1; }
        h1 { text-align: center; font-size: 22px; font-weight: 650; }
        .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin: 4px 0 24px; }
        .tabs {
            display: grid; grid-template-columns: 1fr 1fr;
            background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 20px;
        }
        .tabs button {
            font: inherit; border: none; background: none; color: var(--muted);
            padding: 8px; border-radius: 7px; cursor: pointer; font-weight: 500;
        }
        .tabs button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        .field { margin-bottom: 14px; }
        input {
            width: 100%; font: inherit; color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 12px; outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
        .error {
            display: none; margin-bottom: 14px; padding: 9px 12px; border-radius: 9px; font-size: 13px;
            color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent);
        }
        .error.show { display: block; }
        .submit {
            width: 100%; font: inherit; font-weight: 600; cursor: pointer;
            border: none; border-radius: 10px; padding: 11px;
            background: var(--accent); color: #fff; margin-top: 4px;
            transition: background .15s, opacity .15s;
        }
        .submit:hover { background: var(--accent-hover); }
        .submit:disabled { opacity: .6; cursor: wait; }
        .register-only { display: none; }
        .mode-register .register-only { display: block; }
    </style>
</head>
<body>
<div class="card" id="card">
    <div class="logo">🥟</div>
    <h1>饺子</h1>
    <p class="subtitle" id="subtitle">登录后继续你的对话</p>

    <div class="tabs">
        <button type="button" class="active" data-mode="login">登录</button>
        <button type="button" data-mode="register">注册</button>
    </div>

    <form id="form" novalidate>
        <div class="error" id="error"></div>
        <div class="field">
            <label for="username">用户名</label>
            <input id="username" autocomplete="username" maxlength="20" required>
            <div class="hint register-only">3-20 位，可用字母、数字、下划线或汉字</div>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <div class="hint register-only">至少 6 位</div>
        </div>
        <div class="field register-only">
            <label for="confirm">确认密码</label>
            <input id="confirm" type="password" autocomplete="new-password">
        </div>
        <button class="submit" id="submit" type="submit">登录</button>
    </form>
</div>

<script>
(function () {
    try {
        const saved = localStorage.getItem('jiaozi-theme');
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.dataset.theme = 'dark';
    } catch (e) {}

    const card = document.getElementById('card');
    const form = document.getElementById('form');
    const errorEl = document.getElementById('error');
    const submit = document.getElementById('submit');
    const password = document.getElementById('password');
    let mode = 'login';

    function setMode(next) {
        mode = next;
        card.classList.toggle('mode-register', mode === 'register');
        document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
        submit.textContent = mode === 'login' ? '登录' : '注册并登录';
        document.getElementById('subtitle').textContent = mode === 'login' ? '登录后继续你的对话' : '创建一个新账号';
        password.autocomplete = mode === 'login' ? 'current-password' : 'new-password';
        showError('');
    }
    function showError(text) {
        errorEl.textContent = text;
        errorEl.classList.toggle('show', !!text);
    }
    document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

    form.onsubmit = async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const pwd = password.value;
        if (!username || !pwd) return showError('请输入用户名和密码');
        if (mode === 'register' && pwd !== document.getElementById('confirm').value) {
            return showError('两次输入的密码不一致');
        }
        submit.disabled = true;
        showError('');
        try {
            const res = await fetch(mode === 'login' ? '/api/login' : '/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: pwd })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || '请求失败（' + res.status + '）');
            location.href = '/';
        } catch (err) {
            showError(err.message);
            submit.disabled = false;
        }
    };
    document.getElementById('username').focus();
})();
</script>
</body>
</html>
