# 云端打包饺子 APK
# - 修改 android/ 目录并推送到 main：自动打包，在 Actions 页面下载（需登录 GitHub）
# - 推送 v 开头的标签（如 v1.0.0）：打包并发布到 Releases，任何人都能下载
# - 也可以在 Actions 页面手动点 "Run workflow"
name: 打包 Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 签名密钥放在仓库 Settings → Secrets and variables → Actions 里
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: 还原签名密钥
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jiaozi-release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/jiaozi-release.p12" >> "$GITHUB_ENV"

      - name: 检查签名配置
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::发布正式版本必须先配置签名密钥（KEYSTORE_BASE64 等 Secrets），见 android/README.md"
              exit 1
            fi
            echo "::warning::没有配置签名密钥，这次打出的是调试签名的测试包，只能试装，以后无法被正式版覆盖安装"
          fi

      - name: 打包
        working-directory: android
        run: |
          VERSION_NAME="${VERSION_NAME#v}" gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/jiaozi.apk"

      - name: 上传 APK（Actions 页面下载）
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.KEYSTORE_BASE64 != '' && 'jiaozi-apk' || 'jiaozi-apk-debug-signed' }}
          path: jiaozi.apk
          retention-days: 30

      - name: 发布到 Releases（只在推送 v 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp jiaozi.apk "jiaozi-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "jiaozi-${GITHUB_REF_NAME}.apk" \
            --title "饺子 ${GITHUB_REF_NAME}" \
            --notes "饺子 🥟 安卓 App ${GITHUB_REF_NAME}。下载 APK 后在手机上安装（需要允许安装未知来源应用）。"
